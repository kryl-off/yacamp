services:
  llm-service:
    build: ./llm-service
    ports:
      - "8001:8000"
    env_file:
      - ./llm-service/.env
    restart: unless-stopped

  telegram-bot:
    build: ./bot
    env_file:
      - ./bot/.env
    environment:
      - LLM_SERVICE_URL=http://llm-service:8000
    depends_on:
      - llm-service
    restart: unless-stopped